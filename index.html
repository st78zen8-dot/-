<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>糖代謝シューティング</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Hiragino Sans","Yu Gothic",sans-serif;
  background:#fff3f6;
  color:#4d2b31;
  text-align:center;
  overflow:hidden;
}
h1{
  margin:8px 0 4px;
  font-size:20px;
  color:#74313c;
}
#topInfo{
  width:min(96vw,420px);
  margin:0 auto 4px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  font-size:12px;
}
.panel{
  background:rgba(255,255,255,.84);
  border:2px solid #ef9cad;
  border-radius:12px;
  padding:4px 2px;
}
#gameWrap{
  position:relative;
  width:min(96vw, calc((100dvh - 145px) * 9 / 16), 420px);
  aspect-ratio:9 / 16;
  height:auto;
  margin:0 auto;
  border:4px solid #d77788;
  border-radius:22px;
  overflow:hidden;
  background:#ffd6df;
  touch-action:none;
}
canvas{
  width:100%;
  height:100%;
  display:block;
}
#message{
  position:absolute;
  left:18px;
  right:18px;
  top:105px;
  padding:16px;
  background:rgba(255,255,255,.97);
  border:3px solid #d77788;
  border-radius:18px;
  color:#5a2b32;
  font-size:15px;
  line-height:1.65;
  display:none;
  z-index:20;
}
button{
  font-size:16px;
  padding:10px 18px;
  margin-top:10px;
  border:none;
  border-radius:14px;
  background:#d96b80;
  color:white;
  font-weight:bold;
}
#controls{
  width:min(96vw,420px);
  margin:7px auto 0;
  display:grid;
  grid-template-columns:1fr 1.2fr 1fr;
  gap:8px;
  padding-bottom:env(safe-area-inset-bottom);
}
.ctrl{
  padding:13px 0;
  border-radius:16px;
  background:#f08da0;
  color:white;
  font-weight:bold;
  user-select:none;
  -webkit-user-select:none;
}
.shoot{background:#6eb66d}
#note{
  width:min(96vw,420px);
  margin:4px auto 0;
  font-size:11px;
  line-height:1.35;
  color:#70414a;
}
</style>
</head>
<body>
<h1>糖代謝シューティング</h1>

<div id="topInfo">
  <div class="panel">血糖値<br><b><span id="bloodText">100</span></b></div>
  <div class="panel">膵臓疲労<br><b><span id="fatigueText">0</span></b></div>
  <div class="panel">残り<br><b><span id="timeText">60</span>秒</b></div>
</div>

<div id="gameWrap">
  <canvas id="canvas"></canvas>
  <div id="message">
    <div id="resultText"></div>
    <button onclick="restartGame()">もう一度あそぶ</button>
  </div>
</div>

<div id="controls">
  <div class="ctrl" id="leftBtn">←</div>
  <div class="ctrl shoot" id="shootBtn">インスリン</div>
  <div class="ctrl" id="rightBtn">→</div>
</div>

<div id="note">
  ジュース・バナナは早く上がる。芋はゆっくり上がる。にんじん・海藻類・キノコ・魚は膵臓の負担を下げる。
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const wrap=document.getElementById("gameWrap");

const bloodText=document.getElementById("bloodText");
const fatigueText=document.getElementById("fatigueText");
const timeText=document.getElementById("timeText");
const message=document.getElementById("message");
const resultText=document.getElementById("resultText");

const imageFiles={
  pancreas:"assets/pancreas.jpg",
  insulin:"assets/insulin.jpg",
  juice:"assets/juice.jpg",
  banana:"assets/banana.jpg",
  sweetPotato:"assets/sweet_potato.jpg",
  carrot:"assets/carrot.jpg",
  seaweed:"assets/seaweed.jpg",
  mushroom:"assets/mushroom.jpg",
  fish:"assets/fish.jpg"
};

const img={};
let loaded=0;
for(const key in imageFiles){
  img[key]=new Image();
  img[key].src=imageFiles[key];
  img[key].onload=()=>{
    loaded++;
    if(loaded===Object.keys(imageFiles).length) initGame();
  };
}

const GAME_W = 1080;
const GAME_H = 1920;
let W = GAME_W;
let H = GAME_H;
let player,bullets=[],foods=[],effects=[];
let bloodSugar=100,fatigue=0,score=0,timeLeft=60,frame=0;
let finished=false,timer=null;
let keys={left:false,right:false};
let lesson="私は膵臓。血糖値を見ながらインスリンを出すぞ。";

const foodTypes=[
  {key:"juice",label:"ジュース",group:"単糖類",rise:20,fatigue:8,speed:9.5,size:175,need:1,point:25,message:"単糖類：吸収が速く、血糖値が急に上がる"},
  {key:"banana",label:"バナナ",group:"糖質",rise:13,fatigue:4,speed:7.8,size:175,need:1,point:18,message:"果物の糖も血糖値を上げる。量と組み合わせが大切"},
  {key:"sweetPotato",label:"芋",group:"多糖類",rise:9,fatigue:3,speed:5.8,size:180,need:1,point:15,message:"多糖類：消化されてブドウ糖になり、比較的ゆっくり上がる"},
  {key:"carrot",label:"にんじん",group:"緑黄色野菜",rise:-5,fatigue:-7,speed:6.4,size:168,need:0,point:20,message:"緑黄色野菜：食事全体の血糖上昇をゆるやかにする助け"},
  {key:"seaweed",label:"海藻類",group:"食物繊維",rise:-7,fatigue:-8,speed:6.1,size:175,need:0,point:22,message:"海藻類：食物繊維が多く、血糖値の安定を助ける"},
  {key:"mushroom",label:"キノコ",group:"食物繊維",rise:-6,fatigue:-7,speed:6.1,size:175,need:0,point:22,message:"キノコ：食物繊維が多く、膵臓の負担を減らす助け"},
  {key:"fish",label:"魚",group:"たんぱく質",rise:-2,fatigue:-5,speed:5.5,size:192,need:0,point:18,message:"魚：糖質が少なく、食事バランスを整える"}
];

function resizeCanvas(){
  const rect = wrap.getBoundingClientRect();
  canvas.width = GAME_W;
  canvas.height = GAME_H;
  canvas.style.width = rect.width + "px";
  canvas.style.height = rect.height + "px";
  ctx.setTransform(1,0,0,1,0,0);
  W = GAME_W;
  H = GAME_H;
  if(player){
    player.y = H - 310;
    player.x = Math.max(24, Math.min(W - player.w - 24, player.x));
  }
}
window.addEventListener("resize",resizeCanvas);

function initGame(){
  resizeCanvas();
  player={x:W/2-105,y:H-310,w:210,h:160,speed:14};
  bullets=[]; foods=[]; effects=[];
  bloodSugar=100; fatigue=0; score=0; timeLeft=60; frame=0; finished=false;
  lesson="私は膵臓。血糖値を見ながらインスリンを出すぞ。";
  message.style.display="none";

  clearInterval(timer);
  timer=setInterval(()=>{
    if(!finished){
      timeLeft--;
      if(timeLeft<=0) finishGame();
    }
  },1000);

  requestAnimationFrame(loop);
}

function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#ffd7df");
  g.addColorStop(1,"#fff3f6");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  ctx.strokeStyle="rgba(210,90,110,.30)";
  ctx.lineWidth=90;
  ctx.beginPath();
  ctx.moveTo(W*.08,0);
  ctx.bezierCurveTo(W*.22,H*.25,W*.05,H*.55,W*.22,H);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(W*.92,0);
  ctx.bezierCurveTo(W*.75,H*.25,W*.95,H*.55,W*.78,H);
  ctx.stroke();

  for(let i=0;i<14;i++){
    ctx.fillStyle="rgba(255,255,255,.36)";
    const x=(i*61+frame*.45)%(W+30)-15;
    const y=(i*83+frame*.75)%(H+30)-15;
    ctx.beginPath();
    ctx.arc(x,y,15,0,Math.PI*2);
    ctx.fill();
  }
}

function drawGauge(){
  const x=54,y=48,w=W-108,h=42;
  ctx.fillStyle="#fff";
  roundRect(x,y,w,h,21); ctx.fill();

  const ratio=Math.max(0,Math.min(1,(bloodSugar-50)/150));
  ctx.fillStyle=bloodSugar<70?"#6aa9ff":bloodSugar<=140?"#74c476":"#ff5f6d";
  roundRect(x,y,w*ratio,h,21); ctx.fill();

  ctx.fillStyle="#5a2b32";
  ctx.font="34px sans-serif";
  ctx.fillText("低",x,y+84);
  ctx.fillText("安定",x+w*.45,y+84);
  ctx.fillText("高",x+w-36,y+84);
}

function drawImageContain(image,x,y,w,h){
  const iw=image.width||1, ih=image.height||1;
  const r=Math.min(w/iw,h/ih);
  const nw=iw*r, nh=ih*r;
  ctx.drawImage(image,x+(w-nw)/2,y+(h-nh)/2,nw,nh);
}

function drawPlayer(){
  ctx.save();
  ctx.shadowColor="rgba(80,40,40,.25)";
  ctx.shadowBlur=8;
  drawImageContain(img.pancreas,player.x,player.y,player.w,player.h);
  ctx.restore();

  ctx.fillStyle="rgba(255,255,255,.82)";
  roundRect(player.x+22,player.y+player.h-5,player.w-44,52,26); ctx.fill();
  ctx.fillStyle="#5a2b32";
  ctx.font="34px sans-serif";
  ctx.textAlign="center";
  ctx.fillText("膵臓",player.x+player.w/2,player.y+player.h+34);
  ctx.textAlign="start";
}

function drawFoods(){
  foods.forEach(f=>{
    ctx.save();
    ctx.shadowColor="rgba(80,40,40,.22)";
    ctx.shadowBlur=8;
    drawImageContain(img[f.key],f.x-f.size/2,f.y-f.size/2,f.size,f.size);
    ctx.restore();

    ctx.fillStyle="rgba(255,255,255,.88)";
    roundRect(f.x-102,f.y+f.size/2-12,204,54,27); ctx.fill();
    ctx.fillStyle="#4d2b31";
    ctx.font="34px sans-serif";
    ctx.textAlign="center";
    ctx.fillText(f.group,f.x,f.y+f.size/2+30);
    ctx.textAlign="start";
  });
}

function drawBullets(){
  bullets.forEach(b=>{
    drawImageContain(img.insulin,b.x-42,b.y-60,84,120);
  });
}

function drawEffects(){
  effects.forEach(e=>{
    ctx.globalAlpha=e.life/25;
    ctx.fillStyle=e.color;
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  });
}

function drawLessonBox(){
  ctx.fillStyle="rgba(255,255,255,.86)";
  roundRect(42,H-145,W-84,115,36); ctx.fill();
  ctx.fillStyle="#5a2b32";
  ctx.font="34px sans-serif";
  wrapText(lesson,72,H-82,W-144,42);
}

function updatePlayer(){
  if(keys.left) player.x-=player.speed;
  if(keys.right) player.x+=player.speed;
  player.x=Math.max(24,Math.min(W-player.w-24,player.x));
}

function shoot(){
  if(finished) return;
  bullets.push({x:player.x+player.w/2,y:player.y+15,speed:24});
  fatigue+=1.2;
}

function spawnFood(){
  if(frame%42!==0) return;
  const r=Math.random();
  let type;
  if(r<.24) type=foodTypes[0];
  else if(r<.39) type=foodTypes[1];
  else if(r<.57) type=foodTypes[2];
  else if(r<.69) type=foodTypes[3];
  else if(r<.81) type=foodTypes[4];
  else if(r<.92) type=foodTypes[5];
  else type=foodTypes[6];

  foods.push({...type,x:Math.random()*(W-240)+120,y:-135,hit:0});
}

function updateFoods(){
  foods.forEach(f=>f.y+=f.speed);
  foods=foods.filter(f=>{
    if(f.y>H+120){
      bloodSugar+=f.rise;
      fatigue+=f.fatigue;
      if(f.fatigue<0) fatigue=Math.max(0,fatigue);
      lesson=f.message;
      return false;
    }
    return true;
  });
}

function updateBullets(){
  bullets.forEach(b=>b.y-=b.speed);
  bullets=bullets.filter(b=>b.y>-90);
}

function checkHits(){
  for(let i=foods.length-1;i>=0;i--){
    const f=foods[i];
    for(let j=bullets.length-1;j>=0;j--){
      const b=bullets[j];
      const dx=f.x-b.x, dy=f.y-b.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<f.size*.38+30){
        bullets.splice(j,1);
        f.hit++;
        lesson=f.message;

        if(f.need===0){
          bloodSugar+=f.rise;
          fatigue=Math.max(0,fatigue+f.fatigue);
          score+=f.point;
          burst(f.x,f.y,"#65b96a");
          foods.splice(i,1);
          break;
        }

        if(f.hit>=f.need){
          bloodSugar-=f.group==="単糖類"?10:6;
          fatigue+=f.group==="単糖類"?2:1;
          score+=f.point;
          burst(f.x,f.y,"#6eb66d");
          foods.splice(i,1);
          break;
        }
      }
    }
  }
}

function burst(x,y,color){
  for(let i=0;i<12;i++){
    effects.push({
      x:x,y:y,
      vx:Math.random()*12-6,
      vy:Math.random()*12-6,
      r:Math.random()*12+6,
      life:25,
      color:color
    });
  }
}

function updateEffects(){
  effects.forEach(e=>{
    e.x+=e.vx;
    e.y+=e.vy;
    e.life--;
  });
  effects=effects.filter(e=>e.life>0);
}

function updateStatus(){
  fatigue=Math.max(0,Math.min(100,fatigue));
  bloodSugar=Math.max(40,Math.min(220,bloodSugar));

  if(bloodSugar>=190){
    endGame("高血糖になりました。<br>ジュースなどの単糖類が続くと、血糖値が急上昇し、膵臓はインスリンをたくさん出す必要があります。");
  }else if(bloodSugar<=55){
    endGame("低血糖になりました。<br>インスリンを出しすぎると、血液中の糖が減りすぎます。");
  }else if(fatigue>=100){
    endGame("膵臓が疲れきってしまいました。<br>急な血糖上昇が続くと、膵臓はインスリンを出し続けることになります。");
  }

  bloodText.textContent=Math.round(bloodSugar);
  fatigueText.textContent=Math.round(fatigue);
  timeText.textContent=timeLeft;
}

function finishGame(){
  if(finished) return;
  finished=true;
  clearInterval(timer);

  let text;
  if(bloodSugar>=70&&bloodSugar<=140&&fatigue<80){
    text=`ゲームクリア！<br>血糖値を安定範囲に保てました。<br><br>単糖類・多糖類・野菜・海藻類などの違いを考えながら、膵臓の負担を調整できています。<br><br>スコア：${score}`;
  }else if(bloodSugar>140){
    text=`時間終了。血糖値が高めです。<br>単糖類への対応が遅れると、血液中に糖が残りやすくなります。<br><br>スコア：${score}`;
  }else if(bloodSugar<70){
    text=`時間終了。血糖値が低めです。<br>インスリンは多すぎても低血糖につながります。<br><br>スコア：${score}`;
  }else{
    text=`時間終了。膵臓が少し疲れています。<br>血糖値の急上昇を減らす食べ方が大切です。<br><br>スコア：${score}`;
  }

  resultText.innerHTML=text;
  message.style.display="block";
}

function endGame(text){
  if(finished) return;
  finished=true;
  clearInterval(timer);
  resultText.innerHTML=text+`<br><br>スコア：${score}`;
  message.style.display="block";
}

function loop(){
  if(finished) return;
  frame++;

  drawBackground();
  drawGauge();

  updatePlayer();
  spawnFood();
  updateFoods();
  updateBullets();
  checkHits();
  updateEffects();
  updateStatus();

  drawFoods();
  drawBullets();
  drawEffects();
  drawPlayer();
  drawLessonBox();

  requestAnimationFrame(loop);
}

function restartGame(){
  initGame();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function wrapText(text,x,y,maxWidth,lineHeight){
  let line="";
  const chars=text.split("");
  let yy=y;
  for(let n=0;n<chars.length;n++){
    const testLine=line+chars[n];
    if(ctx.measureText(testLine).width>maxWidth&&n>0){
      ctx.fillText(line,x,yy);
      line=chars[n];
      yy+=lineHeight;
    }else{
      line=testLine;
    }
  }
  ctx.fillText(line,x,yy);
}

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft") keys.left=true;
  if(e.key==="ArrowRight") keys.right=true;
  if(e.key===" ") shoot();
});
document.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft") keys.left=false;
  if(e.key==="ArrowRight") keys.right=false;
});

function bindHold(id,key){
  const el=document.getElementById(id);
  el.addEventListener("touchstart",e=>{e.preventDefault();keys[key]=true;},{passive:false});
  el.addEventListener("touchend",e=>{e.preventDefault();keys[key]=false;},{passive:false});
  el.addEventListener("mousedown",e=>{e.preventDefault();keys[key]=true;});
  el.addEventListener("mouseup",e=>{e.preventDefault();keys[key]=false;});
  el.addEventListener("mouseleave",()=>{keys[key]=false;});
}
bindHold("leftBtn","left");
bindHold("rightBtn","right");

document.getElementById("shootBtn").addEventListener("touchstart",e=>{
  e.preventDefault();
  shoot();
},{passive:false});
document.getElementById("shootBtn").addEventListener("click",shoot);
</script>
</body>
</html>
